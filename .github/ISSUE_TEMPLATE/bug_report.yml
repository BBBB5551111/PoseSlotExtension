name: 不具合報告
description: Pose Slot Extensionの導入、生成、検証、実機動作の不具合を報告します
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。購入・限定配布アセットそのものは添付せず、エラー全文とバージョン情報を記載してください。
  - type: input
    id: pse-version
    attributes:
      label: Pose Slot Extensionのバージョン
      placeholder: 例: 1.1.5
    validations:
      required: true
  - type: input
    id: unity-version
    attributes:
      label: Unityのバージョン
      placeholder: 例: 2022.3.22f1
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: VRChat SDK - Avatarsのバージョン
      placeholder: 例: 3.10.4
    validations:
      required: true
  - type: input
    id: buddyworks-version
    attributes:
      label: BuddyWorks Poses Extensionのバージョン
      placeholder: 例: 7.2.1
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: 統合方式
      options:
        - Modular Avatar版
        - VRCFury版
    validations:
      required: true
  - type: input
    id: dependency-versions
    attributes:
      label: Modular Avatar・NDMF・VRCFuryのバージョン
      description: 使用していないものは「なし」と記載してください。
      placeholder: MA 1.18.1 / NDMF 1.14.4 / VRCFury 1.1417.0
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 発生した現象
      description: 期待した結果と実際の結果を記載してください。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      placeholder: |
        1. Setupを開く
        2. 対象アバターを選択する
        3. 生成・導入・検証を押す
        4. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Consoleのエラー全文
      description: 省略せず、可能ならスタックトレースをコードブロックで貼り付けてください。
      render: text
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: 確認事項
      options:
        - label: Setupの判定結果とConsoleを確認しました
          required: true
        - label: 購入・限定配布アセットそのものを添付していません
          required: true

